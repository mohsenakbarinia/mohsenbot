name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --audit-level=high || true
      - name: Check for accidentally committed secrets
        run: |
          if grep -rnE 'AIza[0-9A-Za-z_-]{20,}' src backend scripts; then
            echo "ERROR: Potential hardcoded Google API key found!"
            exit 1
          fi
