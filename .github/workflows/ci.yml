name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend
      - run: pytest backend/tests
      - run: python -m unittest backend/tests/test_nexora_backend.py

  docker-build:
    runs-on: ubuntu-latest
    needs: [node-and-frontend, python-backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nexora-backend:ci ./backend
      - run: docker build -t nexora-frontend:ci -f docker/frontend.Dockerfile .
